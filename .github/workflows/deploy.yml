name: Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DROPLET_HOST }}
          username: ${{ vars.DROPLET_USER || 'root' }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e

            # 1. Clone or update the app into /opt/checklist-garden
            #    Load .env first so a private repo can be cloned with the PAT.
            set -a; . /opt/checklist-garden/.env 2>/dev/null || true; set +a
            APP=/opt/checklist-garden
            REPO_URL=https://github.com/planting-moon/checklist-garden.git
            mkdir -p "$APP"
            cd "$APP"
            if [ ! -d .git ]; then
              git init -q
              git remote add origin "$REPO_URL"
            fi
            if [ -n "$GITHUB_PAT" ]; then
              git fetch -q "https://x-access-token:${GITHUB_PAT}@github.com/planting-moon/checklist-garden.git" main
            else
              git fetch -q origin main
            fi
            git checkout -q -B main FETCH_HEAD 2>/dev/null || git reset -q --hard origin/main
            git remote set-url origin "$REPO_URL"

            # 2. Python venv + deps (repo-local)
            [ -d .venv ] || python3 -m venv .venv
            .venv/bin/pip install -q --upgrade pip
            .venv/bin/pip install -q -r requirements.txt

            # 3. Build the opencode harness image the cloud driver uses
            docker build -q -t cg-opencode cloud/

            # 4. Install Caddyfile from the repo (single source of truth)
            sed "s/{\$CADDY_DOMAIN}/${{ vars.CADDY_DOMAIN }}/g" Caddyfile > /etc/caddy/Caddyfile
            caddy reload --config /etc/caddy/Caddyfile || systemctl restart caddy

            # 5. Install + restart the web/agent service
            cp checklist-garden.service /etc/systemd/system/checklist-garden.service
            systemctl daemon-reload
            systemctl enable checklist-garden
            systemctl restart checklist-garden
            systemctl is-active checklist-garden
