# =============================================================
# Task Checklist � Dashboard QoL Improvements
# =============================================================
# Paste these tasks into the Command Center to run the agent.

tasks:
  - id: 1
    repo: checklist-garden
    description: >
      Add a proper run detail page at /runs/{run_id} that shows a per-task
      breakdown. Create/replace web/templates/run_detail.html.

      The page shows: run ID and repo as title, overall status pill,
      started-at timestamp, and a table of tasks with columns ID, Description
      (80 char truncation), Status (colored pill), Branch, Elapsed seconds,
      and a Log link (to task_N.log).

      Add GET /runs/{run_id} route in web/app.py that validates run_id,
      looks up the run via RunManager, reads the run checklist.yaml
      for per-task status, reads logs/results.json for timing, and
      renders the template.

      In command_center.html runs table, change the run_id link to point
      to /runs/{run_id} instead of /command-center/{run_id}/logs.
      Add a View Logs link on the detail page linking to the logs page.
    status: pending
    context_files:
      - web/app.py
      - web/templates/command_center.html
      - web/templates/run_detail.html
      - agent/process.py

  - id: 2
    repo: checklist-garden
    description: >
      Replace ISO timestamps in the runs table with relative times.

      In command_center.html, add a JS function that selects timestamp
      cells (add class ts-cell), converts ISO strings to relative:
      less than 60s = just now, less than 60m = Xm ago, less than 24h = Xh ago,
      less than 7d = Xd ago, else show YYYY-MM-DD. Keep full timestamp
      in title attribute for hover tooltip.
    status: pending
    context_files:
      - web/templates/command_center.html

  - id: 3
    repo: checklist-garden
    description: >
      Add summary stat cards above the runs table in command_center.html.
      Horizontal flexbox row: Total Runs, Active, Completed, Failed.

      Style: white card, subtle border, large number plus small label below.
      Light theme colors.

      Add GET /api/runs/stats endpoint returning JSON with keys total,
      active, finished, failed.

      Stats bar fetches this on page load. Show dash if fetch fails.
    status: pending
    context_files:
      - web/app.py
      - web/templates/command_center.html
