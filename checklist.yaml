- id: 5
  repo: checklist-garden
  description: "Add a template system so users can start a run from a predefined cookbook\
    \ template instead of typing tasks manually.\nCreate agent/template.py with the\
    \ following function:\ndef load_template(name: str) -> dict:\n    '''Load a task\
    \ template from cookbook/templates/ and return\n       a checklist dict with all\
    \ tasks set to pending.'''\n    # Read cookbook/templates/<name>.yaml\n    # Parse\
    \ and validate\n    # Return the checklist dict\n\nSupported template names: code,\
    \ review, deploy, doc (corresponding to the files in cookbook/templates/).\nAdd\
    \ a \"Start from Template\" button to command_center.html that shows a dropdown\
    \ of available templates, pre-fills the textarea with the template content, and\
    \ selects the correct format (yaml).\nAdd an API endpoint POST /api/templates/preview\
    \ that takes a template name and returns the rendered template content as text.\n"
  status: pending
  context_files:
  - web/app.py
  - web/templates/command_center.html
  - agent/checklist.py
  - cookbook/templates/code-task.yaml
- id: 6
  repo: checklist-garden
  description: 'The coder-checklist.yaml is loaded by the executor at runtime, but
    users and agents should be able to view and edit it from the dashboard.

    Add a GET /cookbook route that displays the contents of cookbook/coder-checklist.yaml
