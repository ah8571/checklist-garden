# =============================================================
# Task Checklist — Run: UI Minimalist Makeover
# =============================================================
# Status values: pending | in_progress | done | failed | timeout | budget_exceeded

tasks:
  # ── Light theme CSS rewrite ──────────────────────────────

  - id: 1
    repo: "checklist-garden"
    description: >
      Rewrite all CSS in web/templates/base.html to a clean, minimalist
      light theme. Replace the dark navy (#1a1a2e / #16213e / #0f3460)
      color scheme with:

      - Body background: #f8f9fa (light grey)
      - Card/container backgrounds: #ffffff (white)
      - Card borders: #e2e8f0 (subtle grey border)
      - Text color: #1a202c (dark grey, not pure black)
      - Nav background: #ffffff with a subtle bottom border (#e2e8f0)
      - Links and accent color: #3182ce (blue, not red)
      - Keep #e94560 (red) only for error messages and danger buttons
      - Code/pre blocks: #edf2f7 background, #2d3748 text
      - Footer: #f8f9fa background, #a0aec0 text

      Remove the red eye SVG icon from the nav logo. Replace the nav
      title "Checklist Garden" with just plain text, no SVG icon next
      to it. Keep the hamburger menu responsive behavior intact.

      Keep all existing HTML structure and Jinja2 blocks unchanged —
      only modify the <style> block. Do not touch any other templates.
    status: pending
    context_files:
      - "web/templates/base.html"

  # ── Navbar simplification ────────────────────────────────

  - id: 2
    repo: "checklist-garden"
    description: >
      Simplify the navigation bar in web/templates/base.html.
      The current nav has links for "Command Center" and "Settings"
      plus Logout. Change it to:

      - "Runs" linking to /command-center (keep same URL for now)
      - "Logout" (only shown when user is logged in)
      - Remove "Settings" link entirely

      The nav should be clean: brand name on the left, two links on
      the right. No dropdowns, no icons. Keep the hamburger menu for
      mobile but it should show the same two links.
    status: pending
    context_files:
      - "web/templates/base.html"

  # ── Clean up command center page ─────────────────────────

  - id: 3
    repo: "checklist-garden"
    description: >
      Simplify web/templates/command_center.html. The current page has
      many sections and cards. Streamline it to focus on the core
      workflow:

      1. Top section: a large textarea for pasting tasks, with a repo
         selector dropdown and format selector (quick/markdown/yaml).
         Label it "What should the agent work on?"

      2. A prominent "Start Run" button below the textarea.

      3. Below that, a simple table of active/recent runs showing:
         run_id, repo, status, started_at. Each row links to its logs.

      4. Remove: the connected repos list, the checklist preview panel,
         the raw YAML editor, the upload file button, and any other
         sections not directly needed for "paste, run, check."

      Keep the same Jinja2 template variable names used by the backend
      (user_email, repos, all_repos, active_runs, log_files, tasks,
      checklist_raw, checklist_error) so the backend doesn't break.
      Some may become unused — that's fine, just don't reference them
      in the simplified template.
    status: pending
    context_files:
      - "web/templates/command_center.html"
      - "web/app.py"

  # ── Simplify login and register pages ────────────────────

  - id: 4
    repo: "checklist-garden"
    description: >
      Rewrite web/templates/login.html and web/templates/register.html
      with a clean, centered card layout matching the new light theme.

      Both pages should:
      - Have a centered white card (max-width 400px) on the light grey
        background
      - Use the blue accent (#3182ce) for buttons
      - Remove any dark-themed styling remnants
      - Keep the same form fields, error display, and Jinja2 variables
        exactly as they are so the backend works unchanged

      For login.html: email input, password input, "Login" button,
      link to /register.

      For register.html: email input, password input, "Register" button,
      link to /login.
    status: pending
    context_files:
      - "web/templates/login.html"
      - "web/templates/register.html"
      - "web/templates/base.html"

  # ── Add Caddyfile and systemd unit to repo ───────────────

  - id: 5
    repo: "checklist-garden"
    description: >
      Create two new files at the repo root for operational
      documentation so the deployment setup is reproducible:

      1. Create Caddyfile at repo root:
      ```
      checklist.garden {
          reverse_proxy localhost:8000
      }
      ```

      2. Create checklist-garden.service at repo root:
      ```
      [Unit]
      Description=Checklist Garden
      After=network.target

      [Service]
      Type=simple
      User=root
      WorkingDirectory=/workspace/checklist-garden
      ExecStart=/root/agent/.venv/bin/uvicorn web.app:app --host 127.0.0.1 --port 8000
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      ```

      Also add a short "Deployment" section to README.md explaining
      how to use these two files on a fresh VPS (copy Caddyfile to
      /etc/caddy/, copy .service to /etc/systemd/system/, then
      systemctl daemon-reload and enable both).
    status: pending
    context_files:
      - "README.md"
