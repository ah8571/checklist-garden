    Add a POST /cookbook/save route that saves changes to the file (with YAML validation,
    same pattern as /checklist/save).

    Add a "Cookbook" link to the navigation bar (next to "Runs").

    Keep the layout consistent with the light theme: white card, blue accent, clean
    typography.

    '
  status: pending
  context_files:
  - web/app.py
  - web/templates/base.html
  - cookbook/coder-checklist.yaml
- id: 7
  repo: checklist-garden
  description: "Implement a reviewer agent layer that runs after the coder completes\
    \ a task. The reviewer inspects the diff between the agent branch and main, then\
    \ produces a review report with: - Critical issues (must-fix before merge) - Suggestions\
    \ (nice-to-have) - Overall verdict (approve / request-changes) - If request-changes:\
    \ loop back to coder for fixes (max 2 rounds)\nCreate agent/reviewer.py with:\n\
    class ReviewerAgent:\n    def __init__(self, llm: LLMClient, git: GitManager):\n\
    \        # Uses a higher-capability model or different config from coder\n\n \
    \   def review(self, task_result: dict, task_description: str) -> dict:\n    \
    \    # 1. Get diff between main and the run branch\n        # 2. Send diff + task\
    \ description to LLM for review\n        # 3. Parse review response into structured\
    \ verdict\n        # Returns: {\"verdict\": \"approve\"|\"request-changes\",\n\
    \        #           \"critical\": [...], \"suggestions\": [...],\n        # \
    \          \"summary\": \"...\"}\n\nAdd a reviewer system prompt (load from cookbook/\
    \ if available).\nModify agent/runner.py so that after TaskExecutor completes\
    \ a task with status \"done\", it optionally invokes the reviewer. Gate this behind\
    \ a config flag in config.yaml:\n  reviewer:\n    enabled: true\n    max_rounds:\
    \ 2\n    model: deepseek-chat  # or use default_provider\n\nThe reviewer uses\
    \ the SAME LLM client as the coder (no extra API setup needed).\n"
  status: pending
  context_files:
  - agent/executor.py
  - agent/runner.py
  - agent/llm.py
  - agent/git.py
  - config.yaml
  - cookbook/templates/review-task.yaml
- id: 8
  repo: checklist-garden
  description: "Expose reviewer results in the web dashboard:\n1. Add a GET /api/runs/{run_id}/review\
    \ endpoint that returns\n   the review verdict for each task in the run (JSON).\n\
    \n2. In command_center.html, add a \"Review\" column to the runs\n   table showing\
    \ the overall verdict (green check for approve,\n   yellow for request-changes,\
    \ red for critical issues).\n\n3. Add a run detail page at /runs/{run_id} that\
    \ shows:\n   - Each task's status, description, and review verdict\n   - The diff\
    \ summary (if available)\n   - Links to logs and the GitHub PR\n\n4. Store review\
    \ results alongside task results in the runs\n   directory (runs/{run_id}/review.json).\n"
  status: pending
  context_files:
  - web/app.py
  - web/templates/command_center.html
  - agent/runner.py
- id: 9
  repo: checklist-garden
  description: "Implement agent context memory using a .agent-wiki.md file in the\
    \ repo root (referenced in DEVELOPER_ROADMAP_V1.md).\nCreate agent/wiki.py with:\n\
    def load_wiki(repo_path: Path) -> str:\n    '''Read .agent-wiki.md from the repo\
    \ root. Returns empty\n       string if the file doesn't exist.'''\n\ndef append_to_wiki(repo_path:\
    \ Path, entry: str):\n    '''Append a dated entry to .agent-wiki.md.'''\n\ndef\
    \ generate_wiki_summary(llm: LLMClient, tasks: list[dict],\n                 \
    \          results: list[dict]) -> str:\n    '''Ask the LLM to generate a one-paragraph\
    \ summary of\n       what was accomplished in the run, which patterns worked,\n\
    \       and what to watch for next time.'''\n\nModify agent/executor.py _build_context()\
    \ to check for and include .agent-wiki.md content as part of the context sent\
    \ to the LLM (after the file tree, before context files).\nModify agent/runner.py\
    \ to call generate_wiki_summary() after all tasks complete and append the result\
    \ to .agent-wiki.md.\nThis gives the agent persistent memory across runs — it\
    \ learns about the codebase conventions and past decisions.\n"
  status: pending
  context_files:
  - agent/executor.py
  - agent/runner.py
  - agent/llm.py
  - DEVELOPER_ROADMAP_V1.md
