    \ selector (quick/markdown/yaml).\n   Label it \"What should the agent work on?\"\
    \n\n2. A prominent \"Start Run\" button below the textarea.\n3. Below that, a\
    \ simple table of active/recent runs showing:\n   run_id, repo, status, started_at.\
    \ Each row links to its logs.\n\n4. Remove: the connected repos list, the checklist\
    \ preview panel,\n   the raw YAML editor, the upload file button, and any other\n\
    \   sections not directly needed for \"paste, run, check.\"\n\nKeep the same Jinja2\
    \ template variable names used by the backend (user_email, repos, all_repos, active_runs,\
    \ log_files, tasks, checklist_raw, checklist_error) so the backend doesn't break.\
    \ Some may become unused — that's fine, just don't reference them in the simplified\
    \ template.\n"
  status: done
  context_files:
  - web/templates/command_center.html
  - web/app.py
  branch: agent/overnight-2026-07-15-123904
  log_file: logs/task_3.log
