budget:
  max_cost_per_run: 10.0
  max_retries_per_task: 2
  max_tokens_per_task: 100000
default_provider: deepseek
logging:
  level: INFO
  log_dir: ./logs
models:
  anthropic:
    max_tokens: 4096
    model: claude-sonnet-4-20250514
    temperature: 0.2
  deepseek:
    max_tokens: 8192
    model: deepseek-chat
    temperature: 0.2
  openai:
    max_tokens: 4096
    model: gpt-4o
    temperature: 0.2
notifications:
  enabled: false
  on_run_complete: true
  on_task_complete: true
  on_task_fail: true
  provider: twilio
repos:
- branch_prefix: agent/
  default_branch: main
  install_command: /root/agent/.venv/bin/pip install -r requirements.txt
  name: checklist-garden
  test_command: /root/agent/.venv/bin/python -m unittest discover tests
  url: https://github.com/ah8571/checklist-garden.git
  workspace_dir: /workspace/checklist-garden
timeouts:
  git_operation_seconds: 120
  task_timeout_seconds: 900
