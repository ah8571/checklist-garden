# Reviewer Checklist
# Loaded by agent/evaluator.py after each coding task.
# Each section contains concrete checks the reviewer LLM performs against the diff.
# The evaluator produces pass/needs-fix/needs-human based on these criteria.

completeness:
  - Every file listed in context_files was actually modified or created
  - Every element described in the task description was addressed (not just some)
  - No placeholder comments like "TODO" or "implement later" left in the code
  - The commit message accurately describes what was changed

css-theme:
  - All hardcoded color values (#hex, rgb, rgba) are replaced with CSS custom properties (var(--...))
  - Both :root and [data-theme="dark"] variable blocks are updated when colors change
  - New CSS classes use var(--...) references, not hardcoded colors
  - Form elements (input, select, textarea, button) have dark mode styling, not just the container
  - The background grid or pattern uses theme-aware colors, not fixed values

python-backend:
  - New routes have proper path traversal protection (check for '..' and '/' in path params)
  - New endpoints return proper HTTP status codes (not just 200 for everything)
  - Error responses include meaningful messages, not just "Error"
  - Imports are at the top of the file, not inline
  - Function signatures match the existing patterns in the file

html-templates:
  - All Jinja2 template variables and blocks from the original template are preserved
  - New templates extend base.html and use {% block content %}
  - Inline styles use CSS variables (var(--...)) where theme colors are needed
  - The template handles the case where template variables might be undefined
  - Navigation links are wrapped in {% if user_email %} checks when they require auth

git-workflow:
  - No .env files, secrets, or credentials are committed
  - No large binary files or node_modules are staged
  - The diff doesn't contain unrelated whitespace changes or formatting noise
  - Files outside the task scope were not modified
