<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Checklist Garden{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link rel="icon" type="image/png" href="/public/favicon.png">
    <style>
        :root {
            --body-bg: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #1a202c;
            --nav-bg: #ffffff;
            --nav-border: #e2e8f0;
            --card-border: #e2e8f0;
            --code-bg: #edf2f7;
            --code-color: #2d3748;
            --link-color: #3182ce;
            --link-hover: #2b6cb0;
            --footer-bg: #f8f9fa;
            --footer-text: #a0aec0;
            --footer-border: #e2e8f0;
            --hamburger-color: #1a202c;
            --hamburger-hover: #3182ce;
            --nav-link-color: #1a202c;
            --nav-link-hover: #3182ce;
            --nav-links-bg: #ffffff;
            --nav-links-border: #e2e8f0;
            --nav-links-link-border: #e2e8f0;
            --error-color: #e94560;
        }
        [data-theme="dark"] {
            --body-bg: #1a202c;
            --card-bg: #2d3748;
            --text-color: #e2e8f0;
            --nav-bg: #2d3748;
            --nav-border: #4a5568;
            --card-border: #4a5568;
            --code-bg: #4a5568;
            --code-color: #e2e8f0;
            --link-color: #63b3ed;
            --link-hover: #90cdf4;
            --footer-bg: #2d3748;
            --footer-text: #a0aec0;
            --footer-border: #4a5568;
            --hamburger-color: #e2e8f0;
            --hamburger-hover: #63b3ed;
            --nav-link-color: #e2e8f0;
            --nav-link-hover: #63b3ed;
            --nav-links-bg: #2d3748;
            --nav-links-border: #4a5568;
            --nav-links-link-border: #4a5568;
            --error-color: #fc8181;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: var(--body-bg);
            color: var(--text-color);
            line-height: 1.6;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        nav {
            background-color: var(--nav-bg);
            padding: 1rem 0;
            border-bottom: 1px solid var(--nav-border);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
        }
        .nav-title:hover {
            color: var(--link-color);
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            color: var(--nav-link-color);
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: var(--nav-link-hover);
        }
        main {
            padding: 2rem 0;
        }
        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--card-border);
            transition: background-color 0.3s, border-color 0.3s;
        }
        code, pre {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--code-bg);
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--code-color);
            transition: background-color 0.3s, color 0.3s;
        }
        pre {
            padding: 1rem;
            overflow-x: auto;
        }
        a {
            color: var(--link-color);
            text-decoration: none;
        }
        a:hover {
            color: var(--link-hover);
        }
        .error {
            color: var(--error-color);
        }
        footer {
            text-align: center;
            padding: 1.5rem 0;
            color: var(--footer-text);
            font-size: 0.9rem;
            border-top: 1px solid var(--footer-border);
            margin-top: 2rem;
            background-color: var(--footer-bg);
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: var(--hamburger-color);
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        .hamburger:hover span {
            background-color: var(--hamburger-hover);
        }
        .theme-toggle {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            line-height: 1;
            padding: 0 0.2rem;
            color: var(--text-color);
            transition: color 0.2s;
        }
        .theme-toggle:hover {
            color: var(--link-color);
        }
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                gap: 0;
                position: absolute;
                top: 100%;
                right: 0;
                background-color: var(--nav-links-bg);
                border: 1px solid var(--nav-links-border);
                border-top: none;
                min-width: 160px;
                z-index: 100;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links a {
                padding: 0.75rem 1.25rem;
                border-bottom: 1px solid var(--nav-links-link-border);
                color: var(--nav-link-color);
            }
            .nav-links a:last-child {
                border-bottom: none;
            }
            .nav-container {
                position: relative;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container nav-container">
            <a href="/" class="nav-title">
                Checklist Garden
            </a>
            <button class="hamburger" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="/command-center">Runs</a>
                {% if user_email is defined and user_email %}
                <a href="/logout">Logout</a>
                {% endif %}
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <span id="themeIcon">☀️</span>
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            Red-Eye Agent &copy; {{ now.year if now else '2025' }}
        </div>
    </footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const open = navLinks.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', open);
        });
        // Close menu when a link is clicked
        navLinks.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', () => navLinks.classList.remove('open'));
        });

        // Dark mode toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        function setTheme(theme) {
            if (theme === 'dark') {
                body.setAttribute('data-theme', 'dark');
                themeIcon.textContent = '🌙';
            } else {
                body.removeAttribute('data-theme');
                themeIcon.textContent = '☀️';
            }
            localStorage.setItem('theme', theme);
        }

        // Load saved theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme) {
            setTheme(savedTheme);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme('dark');
        }

        themeToggle.addEventListener('click', () => {
            const current = body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            setTheme(current);
        });
    </script>
</body>
</html>
