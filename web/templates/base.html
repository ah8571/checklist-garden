<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Red-Eye Agent{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
    <link rel="icon" type="image/png" href="/public/favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f8f9fa;
            color: #1a202c;
            line-height: 1.6;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        nav {
            background-color: #ffffff;
            padding: 1rem 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-title {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #1a202c;
            text-decoration: none;
        }
        .nav-title:hover {
            color: #3182ce;
        }
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
        }
        .nav-links a {
            color: #1a202c;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #3182ce;
        }
        main {
            padding: 2rem 0;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid #e2e8f0;
        }
        code, pre {
            font-family: 'Courier New', Courier, monospace;
            background-color: #edf2f7;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            color: #2d3748;
        }
        pre {
            padding: 1rem;
            overflow-x: auto;
        }
        a {
            color: #3182ce;
            text-decoration: none;
        }
        a:hover {
            color: #2b6cb0;
        }
        .error {
            color: #e94560;
        }
        footer {
            text-align: center;
            padding: 1.5rem 0;
            color: #a0aec0;
            font-size: 0.9rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 2rem;
            background-color: #f8f9fa;
        }
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
        }
        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background-color: #1a202c;
            border-radius: 2px;
            transition: background-color 0.2s;
        }
        .hamburger:hover span {
            background-color: #3182ce;
        }
        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }
            .nav-links {
                display: none;
                flex-direction: column;
                gap: 0;
                position: absolute;
                top: 100%;
                right: 0;
                background-color: #ffffff;
                border: 1px solid #e2e8f0;
                border-top: none;
                min-width: 160px;
                z-index: 100;
            }
            .nav-links.open {
                display: flex;
            }
            .nav-links a {
                padding: 0.75rem 1.25rem;
                border-bottom: 1px solid #e2e8f0;
                color: #1a202c;
            }
            .nav-links a:last-child {
                border-bottom: none;
            }
            .nav-container {
                position: relative;
            }
        }
    </style>
</head>
<body>
    <nav>
        <div class="container nav-container">
            <a href="/" class="nav-title">
                Red-Eye Agent
            </a>
            <button class="hamburger" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="nav-links" id="navLinks">
                <a href="/command-center">Runs</a>
                {% if user_email is defined and user_email %}
                <a href="/logout">Logout</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            Red-Eye Agent &copy; {{ now.year if now else '2025' }}
        </div>
    </footer>

    <script>
        const navToggle = document.getElementById('navToggle');
        const navLinks = document.getElementById('navLinks');
        navToggle.addEventListener('click', () => {
            const open = navLinks.classList.toggle('open');
            navToggle.setAttribute('aria-expanded', open);
        });
        // Close menu when a link is clicked
        navLinks.querySelectorAll('a').forEach(a => {
            a.addEventListener('click', () => navLinks.classList.remove('open'));
        });
    </script>
</body>
</html>
